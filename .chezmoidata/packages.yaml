# Source of truth for what gets installed: run_20-install-packages turns it into
# a Brewfile. What each package is for, and the decisions behind the list, are
# in the README's "What gets installed".
brew:
  formulae:
    - git
    - gh
    - gnupg
    - pinentry-mac
    - coreutils
    - nodenv
    - yarn
    - awscli
    - ripgrep
    - jenv
    - openjdk@17
    - openjdk@21
    - pyenv
    # installs dot_pyenv/default-packages into every pyenv-managed python
    - btrachey/pyenv/pyenv-default-packages
    - pre-commit
    # not in Homebrew core
    - databricks/tap/databricks
    - vim
    - starship
    - eza
    - bat
    - git-delta
    - fzf
    - fd
    - btop
    - htop
    - jq
    - yq
    # the CLI; the `leapp` cask is the desktop app only
    - leapp-cli
    - skills
    - dockutil
    - npm-check-updates
  casks:
    - google-chrome
    - firefox
    - visual-studio-code
    - iterm2
    - font-meslo-lg-nerd-font
    - postman
    - slack
    - zoom
    - spotify
    - twingate
    - leapp
    - session-manager-plugin
    - microsoft-openjdk@11
    - claude-code
    # the desktop app; claude-code is the CLI
    - claude
    # provides `antigravity` (aliased `agy`), not `gemini`
    - antigravity-cli

vscodeExtensions:
  - amazonwebservices.aws-toolkit-vscode
  - anthropic.claude-code
  - ms-python.python
  - ms-python.vscode-pylance
  - paiqo.databricks-vscode
